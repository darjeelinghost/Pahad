    <!-- Redirect & Countdown Logic -->
    <script>
        (function() {
            const targetUrl = "https://pahad.org";
            let secondsRemaining = 3;
            
            const countdownEl = document.getElementById('countdown');
            const progressBarEl = document.getElementById('progress-bar');

            // Update progress bar immediately on load for smooth transition
            requestAnimationFrame(() => {
                if (progressBarEl) {
                    progressBarEl.style.width = '66%';
                }
            });

            // Countdown interval
            const timer = setInterval(() => {
                secondsRemaining -= 1;

                if (countdownEl && secondsRemaining >= 0) {
                    countdownEl.textContent = secondsRemaining;
                }

                if (progressBarEl) {
                    const percentage = Math.max(0, (secondsRemaining - 1) * 33.3);
                    progressBarEl.style.width = percentage + '%';
                }

                if (secondsRemaining <= 0) {
                    clearInterval(timer);
                    try {
                        // Use replace() so the user doesn't get stuck in a back-button loop
                        window.location.replace(targetUrl);
                    } catch (error) {
                        window.location.href = targetUrl;
                    }
                }
            }, 1000);
        })();
    </script>
